<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intro Python Class</title>
<style>
:root{--bg:#f2f6f6;--ink:#14232b;--mut:#5b6b73;--ac:#14665f;--line:#cfdadd;--card:#fff;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f181c;--ink:#e6eef0;--mut:#9aaab1;--ac:#4fc3b8;--line:#2a3a41;--card:#172329;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:20px}h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem;margin:1.6rem 0 .6rem}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--mut);font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:8px 0}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.item:hover{border-color:var(--ac)}
label{display:block;margin:8px 0;font-size:.9rem;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
textarea,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;overflow:auto;white-space:pre-wrap;border-radius:4px}
button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.g{background:none;color:var(--ac)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.err{color:var(--err)}small,.mut{color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}.sc{overflow-x:auto}
.opt{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ink)}.opt input{width:auto;margin:0}
</style></head><body><div id="app"></div>
<script src="lessons.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong');return d};
const UNITS=['Getting Started','Variables & Data Types','Operators & Expressions','Strings','Booleans & Conditionals','Loops & Iteration','Functions','Lists','Dictionaries','Files, Tuples & a Final Project'];
const LESSONS={1:['Your First Python Program','Printing and Comments','How Python Runs + Errors'],2:['Variables and Numbers','Strings and Booleans','Type Conversion & input()'],3:['Arithmetic Operators','Integer Division and Modulus','abs, round, min, max & Mixing Types','The math Module'],4:['Strings and f-strings','Indexing and Slicing','String Methods'],5:['Comparisons and Booleans','if / elif / else','Logical Operators: and, or, not'],6:['for Loops and range()','while Loops','Nested Loops & Patterns','Drawing with the turtle Module','Randomness with the random Module'],7:['Defining Functions','Parameters & Return Values','Scope & Helper Functions'],8:['Creating and Accessing Lists','List Methods & Looping','List Algorithms & Comprehensions','Summarizing Data with the statistics Module'],9:['Creating and Using Dictionaries','Dictionary Methods & Looping','Counting & Grouping with Dicts'],10:['Tuples and Multiple Return','Putting It Together','Reading Data Files with the csv Module','Capstone Project: Inventory Tracker','Machine Learning: Build a Classifier']};
let me,tab='assign',pre=null;
const unitOpts=()=>UNITS.map((u,i)=>`<option value="${i+1}">Unit ${i+1}: ${esc(u)}</option>`).join('');
async function boot(){const d=await api('me');me=d.me;me?render():auth(d.needsSetup)}
function auth(setup){app.innerHTML=`<main><h1>Intro Python</h1><form id="f" class="card" style="max-width:380px;margin-top:20px">${setup?'<p>First visit: create the teacher account.</p><label>Your name<input name="name" required></label>':''}<label>Username<input name="username" required autocapitalize="none" autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>${setup?'Create teacher account':'Sign in'}</button><p id="err" class="err"></p></form></main>`;
$('#f').onsubmit=async e=>{e.preventDefault();try{await api(setup?'setup':'login','POST',Object.fromEntries(new FormData(e.target)));boot()}catch(x){$('#err').textContent=x.message}}}
function render(){const T=me.role==='teacher';app.innerHTML=`<main><header><h1>Intro Python</h1><div>${esc(me.name)} <button id="out" class="g">Sign out</button></div></header>${T?`<nav>${[['assign','Assignments'],['lib','Lesson library'],['stu','Students'],['grades','Gradebook']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</nav>`:''}<section id="v"></section></main>`;
$('#out').onclick=async()=>{await api('logout','POST');boot()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
T?({assign:tAssign,lib:tLib,stu:tStu,grades:tGrades})[tab]():sList()}
function parseQ(t){return t.trim().split(/\n\s*\n/).filter(Boolean).map(bl=>{const L=bl.split('\n').map(x=>x.trim()).filter(Boolean),q=L.shift(),o=[];let ans='';L.forEach(l=>{if(l[0]==='=')ans=l.slice(1).trim();else{if(l[0]==='*')ans=o.length;o.push(l.replace(/^\*/,'').trim())}});return o.length?{q,options:o,answer:ans}:{q,answer:ans}})}
async function tAssign(){const L=await api('assignments'),v=$('#v');
v.innerHTML=`<h2>New assignment</h2><form id="n" class="card"><label>Title<input name="title" required></label><div class="row"><label>Type<select name="kind"><option value="quiz">Quiz (auto-graded)</option><option value="homework">Homework (code)</option></select></label><label>Unit<select name="unit">${unitOpts()}</select></label><label>Due date<input name="due" type="date"></label><label>Section (blank = everyone)<input name="section"></label></div><label>Instructions<textarea name="prompt" rows="3"></textarea></label><label id="ql">Questions<textarea name="qs" rows="8"></textarea><small>Separate questions with a blank line. Question on the first line, then one answer choice per line; put * before the correct one. For short answer, write =answer instead of choices.</small></label><button>Assign</button><p id="err" class="err"></p></form><h2>Assigned</h2>${L.map(a=>`<div class="card item" data-id="${a.id}"><span><b>${esc(a.title)}</b><br><small>${a.kind==='quiz'?'Quiz':'Homework'} · Unit ${a.unit}${a.section?' · '+esc(a.section):''}${a.due?' · due '+esc(a.due):''} · ${a.subs} submitted</small></span><button class="g" data-del="${a.id}">Delete</button></div>`).join('')||'<p class="mut">Nothing assigned yet.</p>'}`;
const f=$('#n'),sync=()=>$('#ql').style.display=f.kind.value==='quiz'?'':'none';f.kind.onchange=sync;if(pre){for(const k in pre)f[k].value=pre[k];pre=null}sync();
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.questions=d.kind==='quiz'?parseQ(d.qs||''):[];if(d.kind==='quiz'&&!d.questions.length){$('#err').textContent='Add at least one question.';return}delete d.qs;try{await api('assignments','POST',d);tAssign()}catch(x){$('#err').textContent=x.message}};
v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(confirm('Delete this assignment and its submissions?')){await api('assignments/'+b.dataset.del,'DELETE');tAssign()}});
v.querySelectorAll('.item').forEach(i=>i.onclick=()=>tDetail(i.dataset.id))}
async function tDetail(id){const a=await api('assignments/'+id),v=$('#v');
v.innerHTML=`<button class="g" id="bk">Back</button><h2>${esc(a.title)}</h2><p class="mut">${esc(a.prompt)}</p>${a.kind==='quiz'?a.questions.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options?q.options.map((o,j)=>`<div>${j===q.answer?'✔ ':'&nbsp;&nbsp;&nbsp;'}${esc(o)}</div>`).join(''):`<div>Answer: ${esc(q.answer)}</div>`}</div>`).join(''):''}<h2>Submissions</h2>${a.subs.map(s=>`<div class="card"><b>${esc(s.name)}</b> <small>${new Date(s.submitted_at).toLocaleString()}</small>${a.kind==='homework'?`<pre>${esc(JSON.parse(s.answers))}</pre>`:''}<div class="row"><label>Score (0-100)<input data-s="${s.id}" value="${s.score??''}" type="number"></label><label>Feedback<input data-f="${s.id}" value="${esc(s.feedback)}"></label></div><button data-g="${s.id}">Save grade</button></div>`).join('')||'<p class="mut">No submissions yet.</p>'}`;
$('#bk').onclick=tAssign;v.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const i=b.dataset.g;await api(`submissions/${i}/grade`,'POST',{score:v.querySelector(`[data-s="${i}"]`).value,feedback:v.querySelector(`[data-f="${i}"]`).value});b.textContent='Saved'})}
function tLib(){$('#v').innerHTML='<h2>Lesson library</h2><p class="mut">Pick a quiz or homework to load it into the assignment form, then set the due date and section.</p>'+LIB.map((u,i)=>`<h2>Unit ${i+1}: ${esc(UNITS[i])}</h2>`+u.map((l,j)=>`<div class="card item" style="cursor:default"><span>${esc(LESSONS[i+1][j])}</span><span><button class="g" data-u="${i}" data-l="${j}" data-k="quiz">Quiz</button> <button class="g" data-u="${i}" data-l="${j}" data-k="homework">Homework</button></span></div>`).join('')).join('');
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u,l=LIB[u][+b.dataset.l],n=LESSONS[u+1][+b.dataset.l],q=b.dataset.k==='quiz';pre={kind:b.dataset.k,unit:u+1,title:`Unit ${u+1}: ${n} (${q?'Quiz':'Homework'})`,prompt:q?'Answer every question.':l[3],qs:q?qText(l.slice(0,3)):''};tab='assign';render()})}
async function tStu(){const L=await api('students'),v=$('#v');
v.innerHTML=`<h2>Add students</h2><form id="n" class="card"><label>One per line: Name, Section<textarea name="text" rows="5"></textarea></label><button>Create accounts</button></form><div id="new"></div><h2>Roster (${L.length})</h2>${L.map(s=>`<div class="card item" style="cursor:default"><span><b>${esc(s.name)}</b> <small>${esc(s.username)}${s.section?' · '+esc(s.section):''}</small></span><span><button class="g" data-r="${s.id}">Reset password</button> <button class="g" data-d="${s.id}">Remove</button></span></div>`).join('')}`;
$('#n').onsubmit=async e=>{e.preventDefault();const r=await api('students','POST',{text:e.target.text.value});$('#new').innerHTML=`<div class="card"><b>Copy these now. Passwords are not shown again.</b><pre>${r.map(s=>`${s.name}\t${s.username}\t${s.password}`).join('\n')}</pre></div>`;e.target.reset()};
v.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const r=await api(`students/${b.dataset.r}/reset`,'POST');alert('New password: '+r.password)});
v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this student and their work?')){await api('students/'+b.dataset.d,'DELETE');tStu()}})}
async function tGrades(){const d=await api('grades');$('#v').innerHTML=`<h2>Gradebook</h2><div class="sc"><table><tr><th>Student</th>${d.assignments.map(a=>`<th>${esc(a.title)}</th>`).join('')}</tr>${d.students.map(s=>`<tr><td>${esc(s.name)}</td>${d.assignments.map(a=>{const x=d.subs.find(y=>y.assignment_id===a.id&&y.user_id===s.id);return`<td>${x?(x.score??'to grade'):'–'}</td>`}).join('')}</tr>`).join('')}</table></div>`}
async function sList(){const L=await api('assignments'),v=$('#v');
v.innerHTML=`<h2>Your assignments</h2>${L.map(a=>`<div class="card item" data-id="${a.id}"><span><b>${esc(a.title)}</b><br><small>${a.kind==='quiz'?'Quiz':'Homework'} · Unit ${a.unit} · ${esc(LESSONS[a.unit]?.[0]||'')}…${a.due?' · due '+esc(a.due):''}</small></span><span>${a.submitted_at?(a.score!=null?a.score+'%':'Submitted'):'To do'}</span></div>`).join('')||'<p class="mut">Nothing assigned yet.</p>'}`;
v.querySelectorAll('.item').forEach(i=>i.onclick=()=>sDetail(i.dataset.id))}
let py;async function runPy(code){if(!py){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=ok;s.onerror=no;document.head.append(s)});py=await loadPyodide()}let out='';py.setStdout({batched:s=>out+=s+'\n'});py.setStderr({batched:s=>out+=s+'\n'});py.setStdin({stdin:()=>prompt('input():')});try{await py.runPythonAsync(code)}catch(e){out+=String(e.message).split('\n').slice(-3).join('\n')}return out||'(no output)'}
async function sDetail(id){const a=await api('assignments/'+id),v=$('#v'),m=a.mine,quiz=a.kind==='quiz';
const prev=m&&!quiz?JSON.parse(m.answers):'';
v.innerHTML=`<button class="g" id="bk">Back</button><h2>${esc(a.title)}</h2><p>${esc(a.prompt)}</p>${m&&m.score!=null?`<div class="card"><b>Score: ${m.score}%</b>${m.feedback?'<br>'+esc(m.feedback):''}</div>`:''}${quiz?a.questions.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options?q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" ${m?'disabled':''}> ${esc(o)}</label>`).join(''):`<input name="q${i}" ${m?'disabled':''}>`}</div>`).join('')+(m?'<p class="mut">Submitted.</p>':'<button id="go">Submit quiz</button>'):`<label>Your code<textarea id="code" rows="14" spellcheck="false">${esc(prev)}</textarea></label><button class="g" id="run">Run</button> <button id="go">${m?'Resubmit':'Submit'}</button><pre id="out" hidden></pre>`}<p id="err" class="err"></p>`;
$('#bk').onclick=sList;
if(!quiz)$('#run').onclick=async()=>{const o=$('#out');o.hidden=false;o.textContent='Running…';try{o.textContent=await runPy($('#code').value)}catch(e){o.textContent='Could not load the Python runner.'}};
const go=$('#go');if(go)go.onclick=async()=>{const ans=quiz?a.questions.map((q,i)=>{const el=v.querySelector(`[name="q${i}"]${q.options?':checked':''}`);return el?(q.options?+el.value:el.value):null}):$('#code').value;if(quiz&&!confirm('Submit your answers? You only get one try.'))return;try{await api(`assignments/${id}/submit`,'POST',{answers:ans});sDetail(id)}catch(x){$('#err').textContent=x.message}}}
boot();
</script></body></html>
